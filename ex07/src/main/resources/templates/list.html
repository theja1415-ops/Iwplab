<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <h2 class="mb-3">Student Records</h2>
        <a class="btn btn-primary mb-3" th:href="@{/students/new}">+ Add Student</a>
        
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.id}">1</td>
                    <td th:text="${s.name}">John</td>
                    <td th:text="${s.email}">john@x.com</td>
                    <td th:text="${s.course}">CS</td>
                    <td th:text="${s.phone}">9876543210</td>
                    <td>
                        <a class="btn btn-sm btn-warning" th:href="@{|/students/${s.id}/edit|}">Edit</a>
                        <form th:action="@{|/students/${s.id}/delete|}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
