<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Student Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <h2 th:text="${title}">Add Student</h2>
        
        <form th:action="@{/students}" th:object="${student}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" th:field="*{name}">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" th:field="*{email}">
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Course</label>
                <input class="form-control" th:field="*{course}">
                <div class="text-danger" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input class="form-control" th:field="*{phone}">
                <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            
            <button class="btn btn-success" type="submit">Save</button>
            <a class="btn btn-secondary" th:href="@{/students}">Cancel</a>
        </form>
    </div>
</body>
</html>
