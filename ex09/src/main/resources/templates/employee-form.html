<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Employee Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <h2 th:text="${title}">Add Employee</h2>
        <form th:action="@{/employees}" th:object="${employee}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" th:field="*{name}">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" th:field="*{email}">
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Department</label>
                <input class="form-control" th:field="*{department}">
                <div class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Salary</label>
                <input class="form-control" th:field="*{salary}" type="number" step="0.01">
                <div class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
            </div>
            
            <button class="btn btn-success" type="submit">Save</button>
            <a class="btn btn-secondary" th:href="@{/employees}">Cancel</a>
        </form>
    </div>
</body>
</html>
