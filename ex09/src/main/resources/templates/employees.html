<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Employee Records</h2>
            <a class="btn btn-primary" th:href="@{/employees/new}">+ Add Employee</a>
        </div>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${employees}">
                    <td th:text="${e.id}">1</td>
                    <td th:text="${e.name}">John</td>
                    <td th:text="${e.email}">john@x.com</td>
                    <td th:text="${e.department}">HR</td>
                    <td th:text="${e.salary}">50000</td>
                    <td>
                        <a class="btn btn-sm btn-warning" th:href="@{|/employees/${e.id}/edit|}">Edit</a>
                        <form th:action="@{|/employees/${e.id}/delete|}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
